<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博主列表</title>
<style>
.loading-box{
  padding:30px;
  text-align:center;
}
.spin{
  width:36px;height:36px;
  border:3px solid #eee;
  border-top:#2563eb solid 3px;
  border-radius:50%;
  animation: rot 0.8s linear infinite;
  margin:0 auto 10px;
}
@keyframes rot{
  100%{transform:rotate(360deg);}
}
.item{
  padding:10px 14px;
  border-bottom:1px solid #efefef;
}
.hidden{display:none;}
</style>
</head>
<body>
  <div id="loadingWrap" class="loading-box">
    <div class="spin"></div>
    <div>正在获取博主数据...</div>
  </div>
  <div id="listWrap" class="hidden"></div>

<script>
const loadingWrap = document.getElementById('loadingWrap');
const listWrap = document.getElementById('listWrap');

// 模拟接口，只用延时，不再请求外部资源，杜绝跨域
async function fakeGetBloggerList(){
  // 随机等待 600~1600ms，模拟接口耗时
  const delay = 600 + Math.random() * 1000;
  await new Promise(resolve => setTimeout(resolve, delay));

  // 加载本地data.json
  const res = await fetch("./data.json");
  const data = await res.json();

  return {
    code:200,
    msg:"success",
    data: data
  };
}

// 渲染列表
function renderList(arr){
  listWrap.innerHTML = "";
  arr.forEach(item=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <h3>${item.name}</h3>
      <p>${item.desc}</p>
      <a href="${item.url}" target="_blank">访问主页</a>
    `
    listWrap.appendChild(div);
  })
}

// 执行
(async ()=>{
  try{
    const resp = await fakeGetBloggerList();
    loadingWrap.classList.add("hidden");
    listWrap.classList.remove("hidden");
    if(resp.code === 200){
      renderList(resp.data);
    }
  }catch(e){
    loadingWrap.querySelector("div:last-child").innerText = "数据加载失败，请检查json";
    console.error("加载异常：",e);
  }
})()
</script>
</body>
</html>
