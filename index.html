<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博主列表</title>
<style>
.loading-box{
  padding:30px;
  text-align:center;
}
.spin{
  width:36px;height:36px;
  border:3px solid #eee;
  border-top:#2563eb solid 3px;
  border-radius:50%;
  animation: rot 0.8s linear infinite;
  margin:0 auto 10px;
}
@keyframes rot{
  100%{transform:rotate(360deg);}
}
.item{
  padding:14px 16px;
  border-bottom:1px solid #efefef;
}
.tag{
  display:inline-block;
  font-size:12px;
  padding:2px 6px;
  background:#e8f0fe;
  color:#2563eb;
  border-radius:4px;
  margin-right:6px;
}
.name{
  font-size:18px;
  font-weight:bold;
  margin:4px 0 6px;
}
.desc{
  color:#444;
  margin:8px 0;
  font-size:14px;
  line-height:1.6;
}
.hidden{display:none;}
</style>
</head>
<body>
  <div id="loadingWrap" class="loading-box">
    <div class="spin"></div>
    <div>正在获取博主数据...</div>
  </div>
  <div id="listWrap" class="hidden"></div>

<script>
const loadingWrap = document.getElementById('loadingWrap');
const listWrap = document.getElementById('listWrap');

async function fakeGetBloggerList(){
  const delay = 600 + Math.random() * 1000;
  await new Promise(resolve => setTimeout(resolve, delay));
  // 修正文件名 blogData.json
  const res = await fetch("./blogData.json");
  const data = await res.json();
  return {
    code:200,
    msg:"success",
    data: data
  };
}

function renderList(arr){
  listWrap.innerHTML = "";
  arr.forEach(item=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <span class="tag">${item.tag}</span>
      <div class="name">${item.name}</div>
      <p class="desc">${item.desc}</p>
      <a href="${item.url}" target="_blank">访问主页</a>
    `
    listWrap.appendChild(div);
  })
}

(async ()=>{
  try{
    const resp = await fakeGetBloggerList();
    loadingWrap.classList.add("hidden");
    listWrap.classList.remove("hidden");
    if(resp.code === 200){
      renderList(resp.data);
    }
  }catch(e){
    loadingWrap.querySelector("div:last-child").innerText = "数据加载失败，请检查json文件名与编码";
    console.error("加载异常：",e);
  }
})()
</script>
</body>
</html>
