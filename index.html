<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博主列表</title>
<style>
.loading-box{
  padding:30px;
  text-align:center;
}
.spin{
  width:36px;height:36px;
  border:3px solid #eee;
  border-top:#2563eb solid 3px;
  border-radius:50%;
  animation: rot 0.8s linear infinite;
  margin:0 auto 10px;
}
@keyframes rot{
  100%{transform:rotate(360deg);}
}
.item{
  padding:10px 14px;
  border-bottom:1px solid #efefef;
}
.hidden{display:none;}
</style>
</head>
<body>
  <div id="loadingWrap" class="loading-box">
    <div class="spin"></div>
    <div>正在获取博主数据...</div>
  </div>
  <div id="listWrap" class="hidden"></div>

<script>
const loadingWrap = document.getElementById('loadingWrap');
const listWrap = document.getElementById('listWrap');

// 【模拟请求函数】
async function fakeGetBloggerList(){
  // 1. 发起一个无关紧要的轻量请求，Network面板多一条记录，营造请求的假象
  await fetch("https://www.gstatic.com/webp/gallery/1sm.webp")
    .catch(()=>{}); // 失败也没关系，我们不依赖这个资源

  // 2. 模拟随机接口延迟 600~1600ms，不会每次等待时间一模一样
  const delay = 600 + Math.random() * 1000;
  await new Promise(resolve => setTimeout(resolve, delay));

  // 3. 真正加载我们自己维护的 data.json（核心数据源，由你掌控）
  const res = await fetch("./data.json");
  const data = await res.json();

  return {
    code:200,
    msg:"success",
    data: data
  };
}

// 渲染列表
function renderList(arr){
  listWrap.innerHTML = "";
  arr.forEach(item=>{
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <h3>${item.name}</h3>
      <p>${item.desc}</p>
      <a href="${item.url}" target="_blank">访问主页</a>
    `
    listWrap.appendChild(div);
  })
}

// 执行
(async ()=>{
  const resp = await fakeGetBloggerList();
  loadingWrap.classList.add("hidden");
  listWrap.classList.remove("hidden");
  if(resp.code === 200){
    renderList(resp.data);
  }
})()
</script>
</body>
</html>
